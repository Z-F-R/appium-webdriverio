
name: BrowserStack Mobile Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Upload APK to BrowserStack
        id: upload-app
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@apps/Notes_com_s17labs_notesapp_1_0_5.apk" \
            -F "custom_id=NotesApp")

          echo "$response" | jq .
          app_url=$(echo "$response" | jq -er '.app_url')
          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

      - name: Run tests on BrowserStack
        env:
          TEST_ENV: browserstack
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL: ${{ steps.upload-app.outputs.app_url }}
        run: npm test

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npm run allure:report
          else
            echo "No Allure results were generated."
          fi

      - name: Upload Allure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-allure-report
          path: |
            allure-results/
            allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        if: always() && hashFiles('allure-report/index.html') != ''
        id: deployment
        uses: actions/deploy-pages@v4
